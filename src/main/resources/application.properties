server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=airline-management

# Graceful container shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Database Configuration (supports local defaults and production env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/airline_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (optimized for FreeDB / Cloud free tier limits)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

# JPA / Hibernate (safe for pre-seeded cloud database)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gemini AI Service
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# JWT Security
jwt.secret=${JWT_SECRET:AerowingAirlinesCloudSecretKey2026SecureJwtHmacSha256Stable!}

# CORS Configuration
frontend.url=${FRONTEND_URL:https://airline-aoop.vercel.app}

# TCP Socket Server Configuration
socket.server.enabled=${SOCKET_SERVER_ENABLED:true}
socket.server.port=${SOCKET_SERVER_PORT:9090}
