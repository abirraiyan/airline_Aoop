server.port=${PORT:8080}
spring.application.name=airline-management

# Database Configuration (supports local defaults and production env vars)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/airline_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gemini AI Service
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# JWT Security
jwt.secret=${JWT_SECRET:}

# CORS Configuration
frontend.url=${FRONTEND_URL:}
